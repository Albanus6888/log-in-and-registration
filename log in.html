<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login and Registration Page</title>
    <link rel="stylesheet" href="style.css">
  
</head>
<body>
  
    
    <div class="container" id="form-container">
        <h2 id="form-title">Login</h2>
        <form id="user-form">
            <!-- Login Inputs -->
            <div id="login-fields">
                <div class="form-group">
                    <label for="login-email">Email:</label>
                    
                    <input type="email" id="email" placeholder="Enter your email">
<small id="emailFeedback" style="color: red; display: none;">Invalid email</small>

                </div>
                
        
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" placeholder="Enter your password">
                    <span id="togglePassword" style="cursor: pointer;">👁️</span>
                </div>
                
            </div>
            <!-- Registration Inputs -->
            <div id="register-fields" style="display: none;">
                <div class="form-group">
                    <label for="reg-name">Full Name:</label>
                    <input type="text" id="reg-name" name="reg-name" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="reg-email">Email:</label>
                    <input type="email" id="reg-email" name="reg-email" placeholder="Enter your email" required>
                </div>
      
                <div class="form-group">
                    <label for="reg-confirm-password">Confirm Password:</label>
                    <input type="password" id="reg-confirm-password" name="reg-confirm-password" placeholder="Confirm your password" required>
                </div>
            </div>
            <button type="submit" class="btn" id="form-button">Login</button>
        </form>
        <a href="#" id="toggle-form" class="toggle-link">Don't have an account? Register here</a>
        <div class="social-login">
            <button class="btn google">Login with Google</button>
            <button class="btn facebook">Login with Facebook</button>
        </div>
        
    </div>
   
    
    <script src="script.js"></script>
</body>



</html>
